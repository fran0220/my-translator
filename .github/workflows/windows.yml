name: Windows 简体中文安装包

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Chinese NSIS installer
        run: npm run build -- --bundles nsis --config src-tauri/tauri.windows.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MyTranslator-windows-x64-zh-CN-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
